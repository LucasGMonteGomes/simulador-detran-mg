name: Testes

# Roda em todo push no main (o merge de um pull request é um push no main) e também nos pull requests para o
# main, para um problema aparecer antes do merge, e não depois.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Um novo push no mesmo pull request cancela a execução anterior; no main, todas as execuções vão até o fim.
concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  testes:
    name: Testes (Java 25 e PostgreSQL via Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # O runner do GitHub já tem Docker, que o Testcontainers usa para subir o PostgreSQL dos testes.
      - name: Rodar os testes
        run: ./mvnw -B verify

      - name: Guardar os relatórios dos testes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-dos-testes
          path: target/surefire-reports/
          retention-days: 7

  imagem:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Só confere que o Dockerfile continua gerando a imagem; a publicação no Docker Hub é manual.
      - name: Gerar a imagem
        run: docker build -t simulador-detran-mg:ci .
