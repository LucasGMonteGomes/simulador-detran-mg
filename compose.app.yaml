# Roda o simulador a partir da imagem publicada no GitHub Container Registry, com um PostgreSQL próprio.
#
# Para só usar o simulador, salve este arquivo como compose.yaml numa pasta só para ele (passo a passo no README):
#   docker compose up -d      # depois, abra http://localhost:8080
#   docker compose down       # para (o histórico de provas continua salvo)
# A porta e a imagem podem ser trocadas num arquivo .env ao lado dele (SIMULADOR_PORTA e SIMULADOR_IMAGEM).
#
# Dentro do repositório, use docker compose -f compose.app.yaml ...: lá, o compose.yaml é o de desenvolvimento, que
# só sobe o banco para o `./mvnw spring-boot:run`.

# Nome próprio: sem ele, o Compose usaria o nome da pasta e misturaria estes containers com os do compose.yaml.
name: simulador-detran-mg-app

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: simulador_detran
      POSTGRES_USER: simulador
      POSTGRES_PASSWORD: simulador
    volumes:
      - dados:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simulador -d simulador_detran"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  app:
    # Outra imagem (uma versão fixa ou uma gerada localmente): SIMULADOR_IMAGEM=nome:tag no .env.
    image: ${SIMULADOR_IMAGEM:-ghcr.io/lucasgmontegomes/simulador-detran-mg:latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/simulador_detran
      SPRING_DATASOURCE_USERNAME: simulador
      SPRING_DATASOURCE_PASSWORD: simulador
      # Horário das provas no histórico.
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${SIMULADOR_PORTA:-8080}:8080"
    restart: unless-stopped

volumes:
  dados:
