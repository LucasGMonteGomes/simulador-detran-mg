spring:
  application:
    name: simulador-detran-mg
  docker:
    compose:
      lifecycle-management: start-only
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  servlet:
    session:
      # Só cookie. Sem isso, o primeiro redirect com mensagem (flash) leva ";jsessionid=..." na URL e cai em 404,
      # além de expor o id da sessão no endereço.
      tracking-modes: cookie

simulador:
  prova:
    total-questoes: 30
    nota-corte: 21
    # Tempo de prova: 1 hora.
    duracao: 60m
    # Proporcional à carga horária do curso teórico (18 h, 16 h, 4 h, 4 h e 3 h, de um total de 45 h).
    questoes-por-disciplina:
      legislacao: 12
      direcao-defensiva: 10
      primeiros-socorros: 3
      meio-ambiente: 3
      mecanica: 2
